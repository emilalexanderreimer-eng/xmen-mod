name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # Starts a real Minecraft server, builds every structure once and checks its people get set up.
      - name: Test structures in a real game
        run: ./gradlew runGameTestServer

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: xmen-mod-jar
          path: build/libs/*.jar

      # Puts the newest jar on the "latest" release page so it's one click to download.
      - name: Publish latest jar
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --title "Latest build" \
            --notes "Newest build of the mod for Minecraft 1.21.1 (NeoForge). Download the .jar below and put it in your mods folder." \
            --target "${GITHUB_SHA}"
